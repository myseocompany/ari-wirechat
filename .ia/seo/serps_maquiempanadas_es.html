function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function priceTier(price) {
  if (price === null || price === undefined) return {label:'', cls:''};
  if (price >= 500) return {label:'INDUSTRIAL', cls:'tier-hi'};
  if (price >= 100) return {label:'PROFESIONAL', cls:'tier-mid'};
  return {label:'DOMÉSTICO', cls:'tier-lo'};
}

function renderOrganic(list) {
  return list.map(o => {
    const cls = o.is_maqui ? 'maqui' : o.is_competitor ? 'competitor' : o.is_retail ? 'retail' : '';
    const tag = o.is_maqui
      ? '<span class="tag tag-mine">Tu sitio</span>'
      : o.is_competitor ? '<span class="tag tag-competitor">Competidor</span>'
      : o.is_retail ? '<span class="tag tag-retail">Retail</span>' : '';
    return `<div class="org ${cls}">
      <div class="top"><span class="pos">#${o.pos}</span><span class="domain">${esc(o.domain||'')}</span>${tag}</div>
      <div class="title"><a href="${esc(o.url||'#')}" target="_blank" rel="noopener">${esc(o.title||'')}</a></div>
      ${o.snippet?`<div class="snippet">${esc(o.snippet)}</div>`:''}
    </div>`;
  }).join('');
}

function renderImages(list) {
  if (!list.length) return '<div style="color: var(--gray); font-size: 0.85rem; text-align: center; padding: 20px 0;">No hay imágenes en este SERP.</div>';
  return '<div class="img-grid">' + list.map(i => `
    <div class="img-item">
      <div class="box">${i.src ? `<img src="${esc(i.src)}" alt="${esc(i.alt||'')}" loading="lazy" onerror="this.style.display='none';this.parentElement.style.display='flex'">` : ''}</div>
      ${i.alt ? `<div class="alt">${esc(i.alt.slice(0,90))}</div>` : ''}
    </div>`).join('') + '</div>';
}

function renderVideoEmbed(v) {
  if (v.youtube_id) {
    return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.youtube_id)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  }
  if (v.instagram_id) {
    return `<iframe src="https://www.instagram.com/reel/${esc(v.instagram_id)}/embed" allowtransparency="true" allowfullscreen loading="lazy" scrolling="no"></iframe>`;
  }
  // Fallback placeholder for Facebook or others
  const icon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  return `<div class="placeholder">
    ${icon}
    <div class="lbl">${esc(v.source||v.domain||'Video externo')}</div>
    ${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">Abrir en ${esc((v.source||v.domain||'sitio').split('·')[0].trim())}</a>` : ''}
  </div>`;
}

function renderVideos(list, shorts) {
  const all = [...list, ...shorts];
  if (!all.length) return '<div style="color: var(--gray); font-size: 0.85rem; text-align: center; padding: 20px 0;">No hay videos en este SERP.</div>';
  return all.map(v => {
    let sourceClass = 'other';
    const src = (v.source||v.domain||'').toLowerCase();
    if (src.includes('youtube')) sourceClass = 'youtube';
    else if (src.includes('instagram')) sourceClass = 'instagram';
    else if (src.includes('facebook')) sourceClass = 'facebook';
    return `<div class="vid">
      <div class="embed">${renderVideoEmbed(v)}</div>
      <div class="info">
        <div class="source ${sourceClass}">${esc(v.source||v.domain||'video')}</div>
        <div class="title">${esc((v.title||'').slice(0,110))}</div>
      </div>
    </div>`;
  }).join('');
}

function renderProducts(list) {
  if (!list.length) return '<div style="color: var(--gray); font-size: 0.85rem; text-align: center; padding: 20px 0;">No hay productos populares en este SERP.</div>';
  return list.slice(0, 15).map(p => {
    const tier = priceTier(p.price);
    return `<div class="prod">
      <div class="top-row">
        <div class="price">$${p.price ? p.price.toLocaleString('en-US', {maximumFractionDigits: 0}) : '—'} <small>USD</small></div>
        ${tier.label ? `<span class="price-tier ${tier.cls}">${tier.label}</span>` : ''}
      </div>
      <div class="title">${esc((p.title||'').slice(0,100))}</div>
      ${p.seller ? `<div class="seller">${esc(p.seller)}</div>` : ''}
    </div>`;
  }).join('');
}

function loadSerp(kw) {
  const item = SERP_DATA[kw];
  if (!item) return;
  const info = KW_INFO[kw] || {note: '', insight: ''};
  const d = item.data;

  document.getElementById('serp-header').innerHTML = `
    <div class="serp-header">
      <div class="kw">🔍 "${esc(kw)}"</div>
      <div class="meta">${esc(info.note)} · Volumen: <strong>${item.volume ? item.volume.toLocaleString() + ' búsquedas/mes' : '—'}</strong></div>
    </div>`;

  document.getElementById('col-web').innerHTML = renderOrganic(d.organic) + (d.paa.length ? '<div class="subhead">People Also Ask</div>' + d.paa.map(q => `<div class="paa">${esc(q)}</div>`).join('') : '');
  document.getElementById('cnt-web').textContent = `${d.organic.length} orgánicos${d.paa.length?' · '+d.paa.length+' PAA':''}`;

  document.getElementById('col-img').innerHTML = renderImages(d.images);
  document.getElementById('cnt-img').textContent = d.images.length;

  document.getElementById('col-vid').innerHTML = renderVideos(d.videos, d.shorts);
  const totalVid = d.videos.length + d.shorts.length;
  document.getElementById('cnt-vid').textContent = totalVid;

  document.getElementById('col-prod').innerHTML = renderProducts(d.products);
  document.getElementById('cnt-prod').textContent = d.products.length;

  document.getElementById('insight-banner').innerHTML = info.insight ? `<div class="insight-banner"><strong>💡 Lectura:</strong> ${esc(info.insight)}</div>` : '';
}

function init() {
  const selector = document.getElementById('selector');
  const kws = Object.keys(SERP_DATA);
  kws.forEach((kw, i) => {
    const pill = document.createElement('button');
    pill.className = 'pill' + (i === 0 ? ' active' : '');
    const vol = SERP_DATA[kw].volume;
    pill.innerHTML = `${esc(kw)}${vol ? `<span class="vol">${vol.toLocaleString()}/mes</span>` : ''}`;
    pill.onclick = () => {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      loadSerp(kw);
    };
    selector.appendChild(pill);
  });
  loadSerp(kws[0]);
}
init();
